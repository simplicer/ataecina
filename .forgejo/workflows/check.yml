# Forgejo Actions on Codeberg (milestone 10): the same gates as a commit,
# on every push to main and every pull request. `docker` is the default
# label of a self-hosted forgejo-runner; Codeberg's hosted runners use
# their own labels (see README, "Continuous integration").
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: docker
    container:
      image: golang:1.27-bookworm
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install what the suite needs besides Go
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends gettext dbus desktop-file-utils zstd xz-utils
      - name: make check
        run: make check
      - name: make e2e
        run: make e2e
      - name: make package
        run: make package
